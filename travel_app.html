<script>
const KEY='travel_pro_v22';let db,tid=null,view='home',mode='tour',settleTab='individual',historySelected=null,settleView='individual';
window.tmpSplit=[];window.tmpSplitTeam='';
const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),trip=()=>db.trips.find(x=>x.id===tid),won=n=>Number(Math.round(n||0)).toLocaleString()+'원';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function localDateStr(d){d=d||new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const CATS=['숙박','식사','교통','입장료/관광','쇼핑','골프','기타'];
const BOOKING_LABELS={hotel:'숙박',flight:'항공권',golf:'골프 티타임',activity:'투어/액티비티/입장권',restaurant:'레스토랑',car:'렌터카',etc:'기타'};

  flight:[['스카이스캐너','스카이스캐너 항공권 가격비교'],['네이버 항공권','네이버 항공권 가격비교'],['인터파크투어','인터파크투어 항공권'],['카약 Kayak','카약 항공권 가격비교']],
  golf:[['골프존카운티','골프존카운티 티타임 예약'],['엑스골프','엑스골프 티타임 예약'],['카카오골프예약','카카오골프예약 티타임'],['골프박스','골프박스 티타임 예약']],
  activity:[['클룩 Klook','클룩 투어 액티비티 예약'],['케이케이데이 KKday','케이케이데이 투어 예약'],['마이리얼트립','마이리얼트립 투어 예약'],['트립닷컴','트립닷컴 투어 예약']],
  restaurant:[['캐치테이블','캐치테이블 레스토랑 예약'],['네이버 예약','네이버 예약'],['망고플레이트','망고플레이트 맛집 정보']],
  car:[['카카오모빌리티 렌터카','카카오모빌리티 렌터카 예약'],['트립닷컴 렌터카','트립닷컴 렌터카 예약'],['롯데렌터카','롯데렌터카 예약']],
  etc:[['네이버 검색','네이버 예약 검색'],['구글 검색','구글 예약 검색']]
};
const TIPS={
  hotel:'여러 예약 플랫폼(아고다·부킹닷컴·야놀자 등)의 가격을 비교하고, 취소 가능 여부와 조식 포함 여부를 함께 확인하세요. 보통 출발 2~3개월 전 예약이 유리한 경우가 많습니다.',
  flight:'스카이스캐너·네이버 항공권 등에서 여러 항공사 가격을 한 번에 비교해보세요. 특가 알림 설정이 도움이 됩니다.',
  golf:'평일 오전/늦은 오후(트와일라잇) 티타임이 상대적으로 저렴한 경우가 많습니다. 여러 예약 앱의 특가 티타임을 비교해보세요.',
  activity:'같은 투어라도 플랫폼마다 가격이 다를 수 있어 2~3곳을 비교하고, 조기예약 할인이 있는지 확인하세요.',
  restaurant:'인기 맛집은 예약 오픈 시간에 맞춰 선점하는 것이 중요합니다. 예약 확정 알림을 꼭 확인하세요.',
  car:'플랫폼별 보험 포함 여부에 따라 총 비용 차이가 크니, 기본요금뿐 아니라 보험료까지 포함한 총액을 비교하세요.',
  etc:'여러 채널의 가격을 함께 비교해보고 예약하세요.'
};

/* ---------- 모드별 데이터 분리 ---------- */
function activeEvents(x){return mode==='golf'?(x.golfData?.events||[]):(x.tour?.events||[])}
function activeExpenses(x){return mode==='golf'?(x.golfData?.expenses||[]):(x.tour?.expenses||[])}
function activePayments(x){return mode==='golf'?(x.golfData?.payments||[]):(x.tour?.payments||[])}
function setActiveEvents(x,a){x[mode==='golf'?'golfData':'tour'].events=a}
function setActiveExpenses(x,a){x[mode==='golf'?'golfData':'tour'].expenses=a}
function setActivePayments(x,a){x[mode==='golf'?'golfData':'tour'].payments=a}
function migrateModeData(t){
 t.tour=t.tour||{events:[],expenses:[],payments:[]}; t.golfData=t.golfData||{events:[],expenses:[],payments:[]};
 if(!t._modeSeparated){if(t.mode==='golf'){t.golfData.events=(t.events||[]).slice();t.golfData.expenses=(t.expenses||[]).slice();t.golfData.payments=(t.payments||[]).slice()}else{t.tour.events=(t.events||[]).slice();t.tour.expenses=(t.expenses||[]).slice();t.tour.payments=(t.payments||[]).slice()}t._modeSeparated=true}
 delete t.events;delete t.expenses;delete t.payments;
}

/* ---------- 데이터 로드 / 마이그레이션 ---------- */
function ensureFields(){
  db.history=db.history||[];
  db.trips=db.trips||[];
  db.favoritePeople=db.favoritePeople||[];
  db.trips.forEach(t=>{
    migrateModeData(t);
    t.teams=t.teams||[];t.checks=t.checks||[];t.notes=t.notes||'';
    t.golf=t.golf||{courses:[],scores:[]};t.golf.courses=t.golf.courses||[];t.golf.scores=t.golf.scores||[];
    t.people=(t.people||[]).map(p=>({id:p.id||uid(),name:p.name||'이름',team:p.team||''}));
    [t.tour,t.golfData].forEach(scope=>{scope.events=(scope.events||[]).map(e=>({id:e.id||uid(),date:e.date||'',time:e.time||'',title:e.title||'일정',place:e.place||'',transport:e.transport||'',route:e.route||'',travelTime:e.travelTime||'',detail:e.detail||'',photos:Array.isArray(e.photos)?e.photos:[],cost:+e.cost||0,payer:e.payer||'',splitScope:e.splitScope||'all',splitWith:e.splitWith||[],splitTeam:e.splitTeam||'',done:!!e.done,category:e.category||'기타',slot:e.slot||'other',bookingStatus:e.bookingStatus||'none',bookingCategory:e.bookingCategory||'etc',recommendType:e.recommendType||'',recommendPlace:e.recommendPlace||'',recommendation:e.recommendation||''}));scope.expenses=(scope.expenses||[]).map(ex=>({id:ex.id||uid(),title:ex.title||'비용',date:ex.date||'',amount:+ex.amount||0,payer:ex.payer||'',splitScope:ex.splitScope||'all',splitWith:ex.splitWith||[],splitTeam:ex.splitTeam||'',category:ex.category||'기타',receiptImage:ex.receiptImage||'',receiptText:ex.receiptText||'',receiptMerchant:ex.receiptMerchant||'',receiptDate:ex.receiptDate||'',receiptAmount:+ex.receiptAmount||0}));scope.payments=(scope.payments||[]).map(r=>({id:r.id||uid(),title:r.title||'회비/수납',date:r.date||'',amount:+r.amount||0,payer:r.payer||'',team:r.team||''}))});
    t.golf.courses=(t.golf.courses||[]).map(c=>({id:c.id||uid(),name:c.name||'골프장',date:c.date||'',tee:c.tee||'',green:+c.green||0,caddy:+c.caddy||0,cart:+c.cart||0,players:+c.players||4,payer:c.payer||'',splitScope:c.splitScope||'all',splitWith:c.splitWith||[],splitTeam:c.splitTeam||'',bookingStatus:c.bookingStatus||'needed',bookingCategory:'golf'}));
    t.checks=(t.checks||[]).map(c=>typeof c==='string'?{id:uid(),text:c,checked:false}:c);
  });
  syncFavoritePeopleFromHistory();
}
function addFavoritePerson(name){
  name=(name||'').trim();if(!name)return;
  db.favoritePeople=db.favoritePeople||[];
  if(!db.favoritePeople.some(f=>f.name===name))db.favoritePeople.push({id:uid(),name});
}
function syncFavoritePeopleFromHistory(){
  db.favoritePeople=db.favoritePeople||[];
  (db.history||[]).forEach(h=>{
    let ppl=(h.snapshot&&h.snapshot.people)||[];
    ppl.forEach(p=>{if(p&&p.name)addFavoritePerson(p.name)});
  });
}
function migrate(){
  let raw=localStorage.getItem(KEY);
  if(raw){try{db=JSON.parse(raw);ensureFields();return}catch(e){}}
  let v21=localStorage.getItem('travel_pro_v21');
  if(v21){try{db=JSON.parse(v21);ensureFields();save();return}catch(e){}}
  let v20=localStorage.getItem('travel_pro_v20');
  if(v20){try{db=JSON.parse(v20);ensureFields();save();return}catch(e){}}
  let v19=localStorage.getItem('travel_pro_v19');
  if(v19){try{db=JSON.parse(v19);ensureFields();save();return}catch(e){}}
  let v17=localStorage.getItem('travel_pro_v17');
  if(v17){try{db=JSON.parse(v17);ensureFields();save();return}catch(e){}}
  let v14=localStorage.getItem('travel_pro_v14');
  if(v14){try{db=JSON.parse(v14);ensureFields();db.trips.forEach(t=>{if(!t._legacyCurrentMovedToGolf){t.tour=t.tour||{events:[],expenses:[],payments:[]};t.golfData=t.golfData||{events:[],expenses:[],payments:[]};if(!(t.golfData.events||[]).length&&(t.tour.events||[]).length){t.golfData.events=t.tour.events.slice();t.golfData.expenses=(t.tour.expenses||[]).slice();t.golfData.payments=(t.tour.payments||[]).slice();t.tour={events:[],expenses:[],payments:[]};}t._legacyCurrentMovedToGolf=true;t.mode='golf';}});save();return}catch(e){}}
  let v11=localStorage.getItem('travel_pro_v11');if(v11){try{db=JSON.parse(v11);ensureFields();save();return}catch(e){}}
  let v10=localStorage.getItem('travel_pro_v10');
  if(v10){try{db=JSON.parse(v10);ensureFields();save();return}catch(e){}}
  let v9=localStorage.getItem('travel_pro_v9');
  if(v9){try{db=JSON.parse(v9);ensureFields();save();return}catch(e){}}

/* ---------- 공통 helper ---------- */
function nameById(x,id){let p=x.people.find(z=>z.id===id);return p?p.name:'미지정'}
function teamName(x,tid2){let t=x.teams.find(z=>z.id===tid2);return t?t.name:'미배정'}
function splitLabel(x,item){if(item.splitScope==='team')return teamName(x,item.splitTeam)+' 팀 전체';if(item.splitScope==='custom')return (item.splitWith||[]).map(id=>nameById(x,id)).join(', ')||'(대상 미지정)';return '전체 인원 균등'}
function targetsFor(x,item){
  const all=x.people.map(p=>p.id);
  if(item.splitScope==='team'){
    const ids=x.people.filter(p=>p.team===item.splitTeam).map(p=>p.id);
    return ids.length?ids:all;
  }
  if(item.splitScope==='custom'){
    const ids=(item.splitWith||[]).filter(id=>x.people.some(p=>p.id===id));
    return ids.length?ids:all;
  }
  return all;
}
function collectCosts(x){
  let items=[];
  activeEvents(x).filter(e=>e.cost>0).forEach(e=>items.push({label:e.title,date:e.date,cost:e.cost,payer:e.payer,category:e.category||'기타',targets:targetsFor(x,e)}));
  (activeExpenses(x)||[]).forEach(e=>items.push({label:e.title,date:e.date,cost:e.amount,payer:e.payer,category:e.category||'기타',targets:targetsFor(x,e),receiptImage:e.receiptImage||'',receiptText:e.receiptText||''}));
  if(mode==='golf'&&x.golf&&x.golf.courses)x.golf.courses.forEach(c=>{let cost=(+c.green||0)+(+c.caddy||0)+(+c.cart||0);if(cost>0)items.push({label:c.name+' (그린/캐디/카트비)',date:c.date,cost,payer:c.payer,category:'골프',targets:targetsFor(x,c)})});
  return items;
}
function computeBalances(x){
  let items=collectCosts(x),paid={},owed={};
  x.people.forEach(p=>{paid[p.id]=0;owed[p.id]=0});
  items.forEach(it=>{
    if(it.payer&&paid[it.payer]!==undefined)paid[it.payer]+=it.cost;
    let n=it.targets.length||1;
    it.targets.forEach(t=>{if(owed[t]!==undefined)owed[t]+=it.cost/n});
  });
  (activePayments(x)||[]).forEach(r=>{if(r.payer&&paid[r.payer]!==undefined)paid[r.payer]+=r.amount});
  let net={};x.people.forEach(p=>net[p.id]=paid[p.id]-owed[p.id]);
  return {items,paid,owed,net};
}
function settlementWarnings(x){
  const warnings=[];
  const all=x.people.map(p=>p.id);
  if(!all.length)warnings.push('참석자가 없습니다. 먼저 인원을 추가하세요.');
  collectCosts(x).forEach(it=>{
    if(it.cost>0&&!it.payer)warnings.push(`‘${it.label}’의 결제자가 지정되지 않았습니다.`);
    if(it.cost>0&&!it.targets.length)warnings.push(`‘${it.label}’의 분담 대상이 없습니다.`);
  });
  const total=collectCosts(x).reduce((s,i)=>s+i.cost,0), net=computeBalances(x).net;
  const sum=Object.values(net).reduce((s,v)=>s+v,0);
  if(Math.abs(sum)>1)warnings.push(`현재 입력 기준 미정산 잔액 ${won(sum)}이 있습니다. 모든 지출의 결제자와 분담 대상을 확인하세요.`);
  return [...new Set(warnings)];
}

function simplifyDebts(net){
  let creditors=Object.entries(net).filter(([,v])=>v>0.5).map(([k,v])=>({id:k,amt:v})).sort((a,b)=>b.amt-a.amt);
  let debtors=Object.entries(net).filter(([,v])=>v<-0.5).map(([k,v])=>({id:k,amt:-v})).sort((a,b)=>b.amt-a.amt);
  let res=[],i=0,j=0;
  while(i<debtors.length&&j<creditors.length){
    let d=debtors[i],c=creditors[j],amt=Math.min(d.amt,c.amt);
    if(amt>0.5)res.push({from:d.id,to:c.id,amt:Math.round(amt)});
    d.amt-=amt;c.amt-=amt;
    if(d.amt<=0.5)i++;
    if(c.amt<=0.5)j++;
  }
  return res;
}
function bookingBadge(it){
  if(!it.bookingStatus||it.bookingStatus==='none')return '';
  if(it.bookingStatus==='needed')return '<span class="badge" style="background:#ffe7e7;color:#b42318">🔴 예약필요</span>';
  return '<span class="badge" style="background:#e6f7f1;color:#087f5b">🟢 예약완료</span>';
}

function planAllDates(x){return ['ALL',...dayDates(x)]}
function plan(){
  let x=trip(),events=activeEvents(x),dates=dayDates(x);
  if(!window.planDate||(window.planDate!=='ALL'&&!dates.includes(window.planDate)))window.planDate=dates[0]||'ALL';
  let shown=(window.planDate==='ALL'?events.slice():events.filter(e=>e.date===window.planDate)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  let dayTotal=shown.reduce((s,e)=>s+(+e.cost||0),0);
  $('app').innerHTML=`<div class="tabs"><button onclick="eventForm()">＋ 일정 추가</button><button class="gray" onclick="importForm()">📥 일정 가져오기</button>${mode==='tour'?'<button class="gray" onclick="recommend()">✨ 주변 추천</button>':''}</div>
   <div class="daytabs" id="planDayTabs"><button class="${window.planDate==='ALL'?'active':''}" onclick="setPlanDate('ALL')">전체</button>${dates.map(d=>`<button class="${d===window.planDate?'active':''}" onclick="setPlanDate('${d}')">${esc(d.slice(5).replace('-','/'))}</button>`).join('')||''}</div>
   ${dates.length?`<div class="muted" style="margin:-4px 0 8px">👈 좌우로 밀어서 날짜를 이동할 수 있어요${window.planDate!=='ALL'?' · 이 날짜 비용 합계 '+won(dayTotal):''}</div>`:'<div class="muted" style="margin:-4px 0 8px">여행 시작일/종료일을 입력하면 날짜별 탭이 자동으로 생성됩니다.</div>'}
   <div id="planDayBody">${shown.map(e=>planEventCard(x,e)).join('')||'<div class="card">이 날짜에 등록된 일정이 없습니다. ‘일정 추가’를 눌러 시간·장소·이동시간·비용·결제자를 입력하세요.</div>'}</div>`;
  setupPlanSwipe();
}
function setPlanDate(d){window.planDate=d;plan()}
function planEventCard(x,e){
  return `<div class="schedule ${e.done?'done':''}">
    <div class="row between"><span class="badge">${esc(e.time||'시간 미정')}</span>${bookingBadge(e)}</div>

    ${e.detail?`<div class="muted">📝 ${esc(e.detail)}</div>`:''}

      <button class="red small" onclick="delE('${e.id}')">🗑️ 삭제</button>
      <button class="gray small" onclick="toggleE('${e.id}')"><span>${e.done?'완료<br>취소':'일정<br>완료'}</span></button>
    </div>
  </div>`;

function setupPlanSwipe(){
  let el=$('planDayBody');if(!el)return;
  let sx=0,sy=0;
  el.ontouchstart=ev=>{let t=ev.touches[0];sx=t.clientX;sy=t.clientY};
  el.ontouchend=ev=>{
    let t=ev.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
      let all=planAllDates(trip()),idx=all.indexOf(window.planDate);if(idx<0)idx=0;
      if(dx<0&&idx<all.length-1)setPlanDate(all[idx+1]);
      else if(dx>0&&idx>0)setPlanDate(all[idx-1]);
    }
  };
}

function handleEventPhotos(ev){
  let files=Array.from(ev.target.files||[]);
  window.tmpPhotos=window.tmpPhotos||[];
  if(!files.length)return;
  if(window.tmpPhotos.length+files.length>4){alert('사진은 최대 4장까지 첨부할 수 있습니다.');files=files.slice(0,Math.max(0,4-window.tmpPhotos.length))}
  Promise.all(files.map(f=>compressReceipt(f))).then(list=>{
    window.tmpPhotos.push(...list);
    renderEventPhotoPreview();
    ev.target.value='';
  }).catch(()=>alert('사진을 불러오는 중 오류가 발생했습니다.'));
}

async function readTextSmart(file){
  const buf=await file.arrayBuffer();
  try{
    return new TextDecoder('utf-8',{fatal:true}).decode(buf);
  }catch(e){
    try{return new TextDecoder('euc-kr').decode(buf)}
    catch(e2){return new TextDecoder('utf-8').decode(buf)}
  }
}
async function handleImportFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{
    if(ext==='xlsx'||ext==='xls'){
      if(typeof XLSX==='undefined')throw Error('Excel 라이브러리를 불러오지 못했습니다.');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
      const items=excelRowsToImportItems(rows);
      window.pendingImportItems=items;
      $('imt').value=items.map(it=>[it.date,it.time,it.title,it.place,it.cost].join(',')).join('\n');
      $('importPreview').innerHTML=`<div class="card">📊 <b>${esc(f.name)}</b><br>총 ${items.length}개 일정으로 분석했습니다.<br><span class="muted">날짜·시간·구분·이동경로·세부내용을 확인한 뒤 [가져오기 실행]을 누르세요.</span></div>`;
    }else if(ext==='pdf'){
      if(!window.pdfjsLib)throw Error('PDF 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
      const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
      for(let i=1;i<=pdf.numPages;i++){const c=await (await pdf.getPage(i)).getTextContent();t+=c.items.map(it=>it.str).join(' ')+'\n'}
      $('imt').value=t.trim();window.pendingImportItems=null;
      $('importPreview').innerHTML=`<div class="card">📄 ${esc(f.name)} · ${pdf.numPages}페이지 텍스트 추출 완료. 내용을 확인 후 가져오세요.</div>`;
    }else{
      $('imt').value=await readTextSmart(f);window.pendingImportItems=null;
      $('importPreview').innerHTML=`<div class="card">📄 ${esc(f.name)} 내용을 읽었습니다.</div>`;
    }
  }catch(err){window.pendingImportItems=null;$('importPreview').innerHTML=`<div class="warn">파일을 읽지 못했습니다: ${esc(err.message||err)}</div>`;}
}
function headerKey(h){return String(h??'').toLowerCase().replace(/[\s_\-./()·➔→]/g,'')}
function findHeaderRow(rows){
  let best={idx:-1,score:0};
  rows.slice(0,15).forEach((r,i)=>{
    const s=r.map(v=>headerKey(v)).join('|');
    let score=0;
    if(/일차|day/.test(s))score+=2;
    if(/구분|분류|category|type/.test(s))score+=2;
    if(/시간|시각|time/.test(s))score+=2;
    if(/출발지.*도착지|장소|위치|route|place/.test(s))score+=2;
    if(/주요일정|일정|내용|세부|detail|title/.test(s))score+=2;
    if(/연락처|운영시간|비고|참고|note/.test(s))score+=1;
    if(score>best.score)best={idx:i,score};
  });
  return best.idx>=0?best.idx:0;
}
function findCol(headers,names){
  const hs=headers.map(headerKey);
  for(const n of names){const k=headerKey(n);const i=hs.findIndex(h=>h===k||h.includes(k)||k.includes(h));if(i>=0)return i}
  return -1;
}
function extractDateToken(v){
  const s=String(v??'').trim();
  let m=s.match(/\((\d{1,2})[./-](\d{1,2})(?:\s*[^)]*)?\)/)||s.match(/(\d{1,2})[./-](\d{1,2})/);
  if(m)return `${String(+m[1]).padStart(2,'0')}/${String(+m[2]).padStart(2,'0')}`;
  return excelDateValue(v);
}
function extractStartTime(v){
  if(v instanceof Date&&!isNaN(v))return `${String(v.getHours()).padStart(2,'0')}:${String(v.getMinutes()).padStart(2,'0')}`;
  const s=String(v??'').trim();
  const m=s.match(/(\d{1,2}:\d{2})/); return m?m[1]:'';
}
function moneyFromText(s){
  const m=String(s??'').replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(?:원|만원)/);
  if(!m)return 0; let n=+m[1]; if(/만원/.test(m[0]))n*=10000; return Math.round(n);
}
function classifySlot(cat){
  const s=String(cat||'');
  if(/조식/.test(s))return 'breakfast'; if(/중식|점심/.test(s))return 'lunch';
  if(/석식|저녁/.test(s))return 'dinner'; if(/회식|만찬|야식/.test(s))return 'party';
  if(/숙박|호텔|체크인|체크아웃/.test(s))return 'stay';
  if(/오전/.test(s))return 'morning'; if(/오후/.test(s))return 'afternoon';
  return 'other';
}
function excelRowsToImportItems(rows){
  if(!rows||!rows.length)return [];
  const hi=findHeaderRow(rows), headers=rows[hi]||[];
  const di=findCol(headers,['일차','날짜','일자','date']), ci=findCol(headers,['구분','분류','category','type']);
  const ti=findCol(headers,['시간','시각','time']), ri=findCol(headers,['출발지 ➔ 도착지','출발지도착지','경로','장소','위치','route','place']);
  const ni=findCol(headers,['주요 일정 및 세부 내용','주요일정및세부내용','일정명','일정','내용','세부내용','title','detail']);
  const bi=findCol(headers,['연락처 / 운영시간 및 비고','연락처운영시간및비고','비고','참고','note']);
  const out=[];let currentDate='';
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[]; if(!row.some(v=>String(v??'').trim()))continue;
    const rawDay=di>=0?row[di]:''; let d=extractDateToken(rawDay);
    if(d)currentDate=d; else d=currentDate;
    const cat=ci>=0?String(row[ci]??'').trim():'일정';
    const tmRaw=ti>=0?String(row[ti]??'').trim():'';
    const tm=extractStartTime(row[ti]);
    const place=ri>=0?String(row[ri]??'').trim():'';
    const detail=ni>=0?String(row[ni]??'').trim():'';
    const note=bi>=0?String(row[bi]??'').trim():'';
    if(!d && !detail && !place)continue;
    let cost=moneyFromText(`${detail} ${note}`);
    const title=cat||'일정';
    const detailParts=[]; if(tmRaw)detailParts.push(`예정시간: ${tmRaw}`); if(detail)detailParts.push(detail); if(note)detailParts.push(`비고: ${note}`);
    out.push({date:d,time:tm,title,place,route:'',detail:detailParts.join('\n'),cost,category:cat||'기타',slot:classifySlot(cat)});
  }
  return out;
}
function excelDateValue(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  let s=String(v??'').trim();
  if(/^\d+(\.\d+)?$/.test(s)&&typeof XLSX!=='undefined'){let n=+s;if(n>20000&&n<60000){let d=XLSX.SSF.parse_date_code(n);return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}}
  return s;
}
function excelTimeValue(v){return extractStartTime(v)}
function excelMoneyValue(v){return moneyFromText(v)||Number(String(v??'').replace(/[^0-9.-]/g,''))||0}
function parseDateToken(tok,x){
  if(!tok)return '';
  tok=String(tok).trim();
  let m=tok.match(/\((\d{1,2})[./-](\d{1,2})/)||tok.match(/^(\d{1,2})[./-](\d{1,2})$/);
  if(m){let y=x.start?x.start.slice(0,4):String(new Date().getFullYear());return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`}
  m=tok.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  return '';
}
function parseImportLine(line,x){
  line=line.trim();if(!line)return null;
  let p=line.split(',').map(s=>s.trim());
  if(p.length>=3){let d=parseDateToken(p[0],x),t=extractStartTime(p[1]);if(d||t)return {date:d,time:t,title:p[2]||'일정',place:p[3]||'',cost:p[4]?(+String(p[4]).replace(/[^0-9]/g,'')||0):0}}
  let d='',t='',cost=0,rest=line,m=rest.match(/(\d{4}[-./]\d{1,2}[-./]\d{1,2}|\d{1,2}[./]\d{1,2})/);
  if(m){d=parseDateToken(m[0],x);rest=rest.replace(m[0],'')}m=rest.match(/(\d{1,2}:\d{2})/);if(m){t=m[1];rest=rest.replace(m[0],'')}m=rest.match(/([\d,]+)\s*원/);if(m){cost=+m[1].replace(/,/g,'')||0;rest=rest.replace(m[0],'')}return {date:d,time:t,title:rest.replace(/^[\s,\-·:]+|[\s,\-·:]+$/g,'').trim()||'일정',place:'',cost}
}
function runImport(){

function localEvents(place,date){

function captureCostSummary(){let node=document.getElementById('costShot');if(!node)return;html2canvas(node,{scale:2,backgroundColor:'#fff'}).then(canvas=>canvas.toBlob(async blob=>{let file=new File([blob],`${trip().title||'여행'}_비용현황.png`,{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'여행 비용 현황',text:'당일 및 누적 비용 현황입니다.'});}catch(e){}}else{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();}}))}
function money(){let x=trip(),items=collectCosts(x),total=items.reduce((s,i)=>s+i.cost,0),dates=[...new Set(items.map(i=>i.date).filter(Boolean))].sort(),cum=0;let days=dates.map(d=>{let day=items.filter(i=>i.date===d),sum=day.reduce((s,i)=>s+i.cost,0);cum+=sum;return{d,day,sum,cum}});let today=localDateStr();$('app').innerHTML=`<div id="costShot" class="costshot"><div class="statgrid"><div class="stat"><span class="muted">총 누적 비용</span><b>${won(total)}</b></div><div class="stat"><span class="muted">오늘 비용</span><b>${won(days.find(z=>z.d===today)?.sum||0)}</b></div></div><div class="muted" style="margin-top:8px">${mode==='golf'?'⛳ 골프 여행':'✈️ 일반 관광'} 비용만 표시됩니다.</div></div><div style="display:flex;justify-content:flex-end;margin:10px 0"><button onclick="captureCostSummary()">📸 동행자에게 공유</button></div>${days.map(d=>`<div class="card"><div class="row between"><h3 style="margin:0">${esc(d.d)}</h3><div style="text-align:right"><b>${won(d.sum)}</b><div class="muted">누적 ${won(d.cum)}</div></div></div>${d.day.map(i=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid #eee"><span>${esc(i.label)}<br><small class="muted">${esc(i.category||'기타')} · ${esc(nameById(x,i.payer))} · ${i.targets.length}명</small></span><b>${won(i.cost)}</b></div>`).join('')}</div>`).join('')||'<div class="card muted">등록된 비용이 없습니다.</div>'}`}

function reconcilePanel(x){
  let warnings=settlementWarnings(x);
  if(!warnings.length)return `<div class="card" style="background:#eafbf3;border:1px solid #b7e9cf"><div class="row"><span style="font-size:20px">✅</span><div><b style="color:#087f5b">검산 완료</b><div class="muted" style="margin-top:2px">모든 지출 항목에 결제자와 분담 대상이 정확히 입력되어, 여정에서 입력한 금액이 정산에 빠짐없이 반영되었습니다.</div></div></div></div>`;
  return `<div class="warn"><b>⚠️ 검산 필요 (${warnings.length}건)</b><div style="margin-top:6px">${warnings.map(w=>`· ${esc(w)}`).join('<br>')}</div></div>`;
}
function settleIndividual(){
  let x=trip(),{net}=computeBalances(x);
  let total=collectCosts(x).reduce((s,i)=>s+i.cost,0);
  let debts=simplifyDebts(net);
  $('settleBody').innerHTML=`
   ${reconcilePanel(x)}
   <div class="card"><h3>총 지출</h3><div class="big">${won(total)}</div><div class="muted">${x.people.length}명 균등 기준 1인당 ${won(x.people.length?total/x.people.length:0)}</div></div>
   <div class="card"><h3>인원별 정산 요약</h3>${x.people.map(p=>`<div class="settlerow"><span>${esc(p.name)}</span><b style="color:${net[p.id]>=0?'#087f5b':'#b42318'}">${net[p.id]>=0?'+':''}${won(net[p.id])}</b></div>`).join('')||'<div class="muted">인원을 추가하세요.</div>'}<div class="muted" style="margin-top:6px">양수(+): 받아야 할 돈 · 음수: 더 내야 할 돈</div></div>
   <div class="card"><h3>💰 송금 정리 (최소 이체 횟수)</h3>${debts.length?debts.map(d=>`<div class="settlerow"><span>${esc(nameById(x,d.from))} <span class="arrow">→</span> ${esc(nameById(x,d.to))}</span><b>${won(d.amt)}</b></div>`).join(''):'<div class="muted">정산할 금액이 없습니다.</div>'}</div>`;
}
function settleTable(){
  let x=trip(),{net,paid,owed}=computeBalances(x);
  let total=collectCosts(x).reduce((s,i)=>s+i.cost,0), received=(activePayments(x)||[]).reduce((s,r)=>s+(+r.amount||0),0);
  let teamRows=[],teamNet={},teamPaid={},teamOwed={};
  x.people.forEach(p=>{let k=p.team||'';teamNet[k]=(teamNet[k]||0)+net[p.id];teamPaid[k]=(teamPaid[k]||0)+paid[p.id];teamOwed[k]=(teamOwed[k]||0)+owed[p.id]});
  let usedTeams=[...new Set(x.people.map(p=>p.team||''))];
  let teamLabel=k=>k?teamName(x,k):'미배정';
  if(settleView==='team'){
    teamRows=usedTeams.map(k=>({id:k,label:teamLabel(k),paid:teamPaid[k]||0,owed:teamOwed[k]||0,net:teamNet[k]||0}));
  }
  let rows=settleView==='team'
    ? teamRows.map(r=>`<tr><td><b>👥 ${esc(r.label)}</b></td><td>${won(r.paid)}</td><td>${won(r.owed)}</td><td>${r.net>=0?'<span class="pos">받음</span>':'<span class="neg">지급</span>'}</td><td><b>${r.net>=0?'+':''}${won(r.net)}</b></td></tr>`).join('')
    : x.people.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${won(paid[p.id])}</td><td>${won(owed[p.id])}</td><td>${net[p.id]>=0?'<span class="pos">받음</span>':'<span class="neg">지급</span>'}</td><td><b>${net[p.id]>=0?'+':''}${won(net[p.id])}</b></td></tr>`).join('');
  let debtMap=settleView==='team'?teamNet:net;
  let debts=simplifyDebts(debtMap);
  let debtName=id=>settleView==='team'?teamLabel(id):nameById(x,id);
  $('settleBody').innerHTML=`
  <div class="statgrid"><div class="stat"><span class="muted">총 지출</span><b>${won(total)}</b></div><div class="stat"><span class="muted">회비/수납</span><b>${won(received)}</b></div></div>
  <div class="card"><div class="row between"><h3 style="margin:0">📊 정산 기준</h3><div class="row"><button class="small ${settleView==='individual'?'active':''} ${settleView==='individual'?'':'gray'}" onclick="setSettleView('individual')">👤 개인별</button><button class="small ${settleView==='team'?'active':''} ${settleView==='team'?'':'gray'}" onclick="setSettleView('team')">👥 팀별</button></div></div><div class="muted" style="margin-top:7px">개인별: 전체 참석자를 각각 계산합니다. 팀별: 개인은 숨기고 팀명 단위로만 계산합니다.</div></div>
  <div class="card"><h3>📊 ${settleView==='team'?'팀별':'개인별'} 최종 정산표</h3><div class="muted">실제 결제 + 회비/수납 − 부담액 = 최종 차액입니다. (+)는 받을 금액, (-)는 추가 지급액입니다.</div>${settlementWarnings(x).map(w=>`<div class="warn" style="margin-top:7px">⚠️ ${esc(w)}</div>`).join('')}
  <div style="overflow:auto;margin-top:10px"><table class="settletable"><thead><tr><th>${settleView==='team'?'팀':'참석자'}</th><th>실제 결제</th><th>부담액</th><th>결과</th><th>차액</th></tr></thead><tbody>${rows||`<tr><td colspan="5">${settleView==='team'?'팀을 구성하세요.':'인원을 추가하세요.'}</td></tr>`}</tbody></table></div></div>
  <div class="card"><h3>💰 ${settleView==='team'?'팀간':'개인간'} 최종 송금표</h3>${debts.length?debts.map(d=>`<div class="settlerow"><span><b>${esc(debtName(d.from))}</b> → <b>${esc(debtName(d.to))}</b></span><b>${won(d.amt)}</b></div>`).join(''):'<div class="muted">정산할 송금 내역이 없습니다.</div>'}</div>`;
}
function setSettleView(v){settleView=v;settleTab='table';renderSettleBody()}

function settleTeam(){
  let x=trip(),{net,paid,owed}=computeBalances(x);
  let teamIds=[...x.teams.map(t=>t.id),''];
  let teamNet={};teamIds.forEach(t=>teamNet[t]=0);
  x.people.forEach(p=>{teamNet[p.team||'']=(teamNet[p.team||'']||0)+net[p.id]});
  let labelOf=t=>t===''?'미배정':teamName(x,t);
  let usedTeams=teamIds.filter(t=>x.people.some(p=>(p.team||'')===t));
  let debts=simplifyDebts(teamNet);
  let total=collectCosts(x).reduce((a,b)=>a+b.cost,0);
  let received=(activePayments(x)||[]).reduce((a,b)=>a+(+b.amount||0),0);
  let teamCards=usedTeams.map(t=>{
    let members=x.people.filter(p=>(p.team||'')===t), cost=0, pay=0;
    collectCosts(x).forEach(it=>{if(it.targets.some(id=>members.some(p=>p.id===id))) cost+=it.cost*(it.targets.filter(id=>members.some(p=>p.id===id)).length/(it.targets.length||1))});
    (activePayments(x)||[]).forEach(r=>{if(members.some(p=>p.id===r.payer))pay+=+r.amount||0});
    return `<div class="card"><div class="row between"><div><b>${esc(labelOf(t))}</b><div class="muted">${members.length}명 · 부담 ${won(cost)} · 회비/수납 ${won(pay)}</div></div><b style="color:${teamNet[t]>=0?'#087f5b':'#b42318'}">${teamNet[t]>=0?'+':''}${won(teamNet[t])}</b></div></div>`;
  }).join('');
  $('settleBody').innerHTML=`
   ${reconcilePanel(x)}
   <div class="statgrid"><div class="stat"><span class="muted">총 지출</span><b>${won(total)}</b></div><div class="stat"><span class="muted">회비/수납</span><b>${won(received)}</b></div></div>
   <div class="card" style="margin-top:10px"><div class="row between"><h3 style="margin:0">👥 팀별 정산</h3><button class="small" onclick="setSettleTab('payment')">＋ 회비 입력</button></div>${teamCards||'<div class="muted" style="margin-top:8px">팀을 구성하세요.</div>'}</div>
   <div class="card"><h3>💰 팀간 송금 정리</h3>${debts.length?debts.map(d=>`<div class="settlerow"><span>${esc(labelOf(d.from))} <span class="arrow">→</span> ${esc(labelOf(d.to))}</span><b>${won(d.amt)}</b></div>`).join(''):'<div class="muted">정산할 금액이 없습니다.</div>'}</div>
   <div class="card"><h3>📌 팀 정산 사용법</h3><div class="muted">① 인원을 개별 추가 → ② A팀/B팀 구성 → ③ 회비/수납 입력 → ④ 비용에서 ‘특정 팀 전체’ 또는 ‘특정 인원’으로 지출 분담 → ⑤ 개인별·팀별 송금액을 확인하세요.</div></div>`;
}

function compressReceipt(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,w=im.width,h=im.height;if(Math.max(w,h)>max){if(w>=h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.76))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function parseReceiptText(text){
  let t=(text||'').replace(/\s+/g,' ').trim(),merchant='';
  let merchantPatterns=[/(?:상호|가맹점|사용처|merchant|store)\s*[:：]?\s*([^|,]{2,40})/i,/(?:업체명|상호명)\s*[:：]?\s*([^|,]{2,40})/i];
  for(let re of merchantPatterns){let m=t.match(re);if(m){merchant=m[1].trim();break}}
  if(!merchant){let m=t.match(/([가-힣A-Za-z0-9][가-힣A-Za-z0-9 .&()_-]{2,30}(?:점|식당|카페|마트|호텔|CC|골프장))/);if(m)merchant=m[1].trim()}
  let date='';let dm=t.match(/(20\d{2})[.\-/년 ]\s*(\d{1,2})[.\-/월 ]\s*(\d{1,2})/);if(dm)date=`${dm[1]}-${String(dm[2]).padStart(2,'0')}-${String(dm[3]).padStart(2,'0')}`;else{let dm2=t.match(/(\d{1,2})[.\-/월 ]\s*(\d{1,2})/);if(dm2){let y=new Date().getFullYear();date=`${y}-${String(dm2[1]).padStart(2,'0')}-${String(dm2[2]).padStart(2,'0')}`}}
  let amount=0,nums=[...t.matchAll(/(?:합계|총액|결제금액|승인금액|amount|total|결제)\D{0,12}([0-9]{1,3}(?:[, ]?[0-9]{3})+|[0-9]{4,9})\s*원?/gi)];if(nums.length)amount=Number(nums[nums.length-1][1].replace(/[, ]/g,''));if(!amount){let all=[...t.matchAll(/([0-9]{1,3}(?:[, ]?[0-9]{3})+|[0-9]{4,9})\s*원/g)];if(all.length)amount=Number(all[all.length-1][1].replace(/[, ]/g,''))}
  return {merchant,date,amount,text:t}
}
async function scanReceipt(ev){
  let f=ev.target.files&&ev.target.files[0];if(!f)return;let status=$('receiptStatus');status.textContent='🧾 영수증 이미지를 준비하고 있습니다...';
  try{
    let image=await compressReceipt(f);window.currentReceipt=window.currentReceipt||{};window.currentReceipt.image=image;$('receiptPreview').innerHTML=`<img src="${image}" style="max-width:100%;max-height:220px;border-radius:10px;border:1px solid #ddd">`;
    status.textContent='🔎 영수증을 분석 중입니다... (사진에 따라 10~30초 정도 걸릴 수 있습니다)';
    if(!window.Tesseract)throw Error('OCR 엔진을 불러오지 못했습니다. 인터넷 연결 후 다시 시도해주세요.');
    let result=await Tesseract.recognize(image,'kor+eng',{logger:m=>{if(m.status==='recognizing text')status.textContent=`🔎 영수증 분석 중... ${Math.round((m.progress||0)*100)}%`}});
    let parsed=parseReceiptText(result.data.text||'');window.currentReceipt={image,text:result.data.text||'',merchant:parsed.merchant,date:parsed.date,amount:parsed.amount};
    if(parsed.merchant&&!$('exn').value)$('exn').value=parsed.merchant;
    if(parsed.date)$('exd').value=parsed.date;
    if(parsed.amount)$('exa').value=parsed.amount;
    $('receiptText').value=result.data.text||'';status.textContent=`✅ 자동입력 완료 · 사용처 ${parsed.merchant||'미인식'} · 금액 ${parsed.amount?won(parsed.amount):'미인식'} · 날짜 ${parsed.date||'미인식'}`;
  }catch(err){status.textContent='⚠️ 자동 인식에 실패했습니다. 사진은 보관되며 아래 내용을 직접 입력할 수 있습니다.';console.error(err)}
}

async function previewGeneratedPdf(){
  let btn=event&&event.target;let prevLabel=btn?btn.textContent:'';if(btn){btn.textContent='⏳ 생성 중...';btn.disabled=true}
  try{
    let doc=await buildReportPdf();
    if(!doc)return;
    if(window.currentPdfPreviewUrl){URL.revokeObjectURL(window.currentPdfPreviewUrl)}
    let blob=doc.output('blob');
    let url=URL.createObjectURL(blob);
    window.currentPdfPreviewUrl=url;
    let box=$('pdfPreviewBox');
    if(box){box.style.display='block';box.innerHTML=`<div class="muted" style="margin:8px 0 4px">총 ${doc.internal.getNumberOfPages()}페이지 · 스크롤/확대해서 전체 내용을 확인하세요.</div><iframe src="${url}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:10px"></iframe>`}
  } finally {
    if(btn){btn.textContent=prevLabel;btn.disabled=false}
  }
}
async function buildReportPdf(){
  let el=$('reportPrint');
  if(!el)return null;
  if(typeof html2canvas==='undefined'||!window.jspdf){alert('PDF 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');return null}
  const prevStyle={maxHeight:el.style.maxHeight,overflow:el.style.overflow,height:el.style.height};
  el.style.maxHeight='none';el.style.overflow='visible';el.style.height='auto';
  let canvas;
  try{
    canvas=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:el.scrollWidth,height:el.scrollHeight,windowHeight:el.scrollHeight});
  }finally{
    el.style.maxHeight=prevStyle.maxHeight;el.style.overflow=prevStyle.overflow;el.style.height=prevStyle.height;
  }
  let {jsPDF}=window.jspdf;
  let doc=new jsPDF('p','mm','a4');
  let pageWidth=doc.internal.pageSize.getWidth(),pageHeight=doc.internal.pageSize.getHeight();
  let imgWidth=pageWidth,imgHeight=canvas.height*imgWidth/canvas.width;
  let heightLeft=imgHeight,position=0;
  let imgData=canvas.toDataURL('image/png');
  doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
  heightLeft-=pageHeight;
  while(heightLeft>0){
    position=heightLeft-imgHeight;
    doc.addPage();
    doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
    heightLeft-=pageHeight;
  }
  return doc;
}
async function downloadReportPdf(){
  let doc=await buildReportPdf();if(!doc)return;

function renderScore(){
  let x=trip(),cid=$('cr')?$('cr').value:(x.golf.courses[0]&&x.golf.courses[0].id);
